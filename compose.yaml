services:
  firewall:
    build: ./firewall
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8080:8080"

  client:
    build: ./client
    network_mode: "service:firewall"
    tty: true
    stdin_open: true

  control:
    build: ./control
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIREWALL_URL=http://firewall:8080
    depends_on:
      - firewall
    tty: true
    stdin_open: true
